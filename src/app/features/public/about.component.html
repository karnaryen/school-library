<app-public-layout>
  <section class="public-section flex flex-col gap-10">
    <div class="flex flex-col gap-4 max-w-2xl">
      <p class="eyebrow">{{ t.appName }}</p>
      <h1 class="section-title">{{ t.about.title }}</h1>
      <p class="section-lead">{{ t.about.intro }}</p>
    </div>

    <div class="grid md:grid-cols-[auto_1fr] gap-8 md:gap-14 items-start">
      <figure class="m-0 flex flex-col items-center gap-3 md:sticky md:top-24">
        <img src="/assets/images/natalia.webp" [alt]="t.about.photoAlt" width="256" height="256" class="w-48 h-48 md:w-64 md:h-64 rounded-full object-cover ring-8 ring-white shadow-lg">
        <figcaption class="text-center">
          <span class="block text-xl font-semibold">{{ t.about.name }}</span>
          <span class="block text-slate-500">{{ t.about.role }}</span>
        </figcaption>
      </figure>

      <div class="flex flex-col gap-5 max-w-prose">
        @for (p of t.about.story; track p) {
          <p class="m-0 text-lg text-slate-700">{{ p }}</p>
        }
        <div class="flex flex-wrap gap-3 mt-3">
          <a routerLink="/rondleiding" class="btn-primary">{{ t.about.cta }}</a>
          <a href="mailto:info@biebouders.nl" class="btn-secondary"><mat-icon>mail</mat-icon>{{ t.about.contact }}</a>
          <a [href]="t.about.portfolioUrl" target="_blank" rel="noopener" class="btn-secondary"><mat-icon>open_in_new</mat-icon>{{ t.about.portfolio }}</a>
        </div>
      </div>
    </div>
  </section>
</app-public-layout>
