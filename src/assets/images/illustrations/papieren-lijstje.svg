<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" fill="none" font-family="Roboto, Helvetica Neue, Arial, sans-serif">
  <title>Papieren uitleenlijst met doorgestreepte namen</title>
  <ellipse cx="220" cy="330" rx="190" ry="18" fill="#dbe7f5"/>
  <g transform="rotate(-3 220 180)">
    <rect x="66" y="26" width="308" height="308" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- punched holes -->
    <circle cx="86" cy="90" r="6" fill="#f4f7fb" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="86" cy="270" r="6" fill="#f4f7fb" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="100" y1="26" x2="100" y2="334" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- ruled lines -->
    <g stroke="#e2e8f0" stroke-width="1.5">
      <line x1="66" y1="96" x2="374" y2="96"/><line x1="66" y1="128" x2="374" y2="128"/><line x1="66" y1="160" x2="374" y2="160"/>
      <line x1="66" y1="192" x2="374" y2="192"/><line x1="66" y1="224" x2="374" y2="224"/><line x1="66" y1="256" x2="374" y2="256"/>
      <line x1="66" y1="288" x2="374" y2="288"/>
    </g>
    <text x="112" y="62" font-size="16" font-weight="700" fill="#14305c">Boek</text>
    <text x="262" y="62" font-size="16" font-weight="700" fill="#14305c">Naam</text>
    <line x1="112" y1="70" x2="356" y2="70" stroke="#14305c" stroke-width="2"/>
    <g font-size="15" font-style="italic" fill="#334155">
      <text x="112" y="118">Dog Man</text><text x="262" y="118">Liv</text>
      <text x="112" y="150">De Gruffalo</text><text x="262" y="150">Mees</text>
      <text x="112" y="182">Boomhut 13</text><text x="262" y="182">Saar</text>
      <text x="112" y="214">Jip en Janneke</text><text x="262" y="214">Daan</text>
      <text x="112" y="246">Dolfje</text><text x="262" y="246">Fenna</text>
      <text x="112" y="278">Mees Kees</text><text x="262" y="278">Noor</text>
    </g>
    <!-- crossed-out names, and one that was crossed out and replaced -->
    <g stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round">
      <line x1="258" y1="114" x2="292" y2="111"/>
      <line x1="258" y1="178" x2="300" y2="175"/>
      <line x1="258" y1="210" x2="304" y2="208"/>
      <line x1="258" y1="242" x2="308" y2="240"/>
    </g>
    <text x="316" y="246" font-size="13" font-style="italic" fill="#334155">Sem?</text>
    <!-- coffee ring -->
    <circle cx="300" cy="284" r="34" stroke="#a16207" stroke-width="7" opacity=".22"/>
    <circle cx="300" cy="284" r="27" stroke="#a16207" stroke-width="2" opacity=".18"/>
  </g>
  <!-- pen -->
  <g transform="rotate(-24 330 300)">
    <rect x="250" y="292" width="150" height="14" rx="7" fill="#1f4e9c"/>
    <rect x="250" y="292" width="30" height="14" rx="7" fill="#f5b942"/>
    <polygon points="400,292 418,299 400,306" fill="#e2e8f0"/>
    <polygon points="412,296.5 418,299 412,301.5" fill="#1e293b"/>
  </g>
</svg>
