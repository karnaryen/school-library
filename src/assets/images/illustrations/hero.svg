<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" font-family="Roboto, Helvetica Neue, Arial, sans-serif">
  <title>Telefoon scant de barcode van een kinderboek</title>
  <circle cx="300" cy="250" r="215" fill="#e3edf9"/>
  <circle cx="90" cy="90" r="14" fill="#f5b942"/>
  <circle cx="500" cy="60" r="8" fill="#38bdf8"/>
  <circle cx="60" cy="420" r="10" fill="#1f4e9c" opacity=".35"/>

  <!-- Paper list, slightly askew, behind everything -->
  <g transform="rotate(-8 150 250)">
    <rect x="58" y="118" width="184" height="256" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="76" y="140" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="160" y="140" width="50" height="8" rx="4" fill="#94a3b8"/>
    <line x1="76" y1="160" x2="224" y2="160" stroke="#e2e8f0" stroke-width="2"/>
    <g fill="#cbd5e1">
      <rect x="76" y="176" width="70" height="8" rx="4"/>
      <rect x="76" y="206" width="56" height="8" rx="4"/>
      <rect x="76" y="236" width="78" height="8" rx="4"/>
      <rect x="76" y="266" width="62" height="8" rx="4"/>
      <rect x="76" y="296" width="72" height="8" rx="4"/>
      <rect x="76" y="326" width="50" height="8" rx="4"/>
    </g>
    <g fill="#64748b">
      <rect x="160" y="176" width="34" height="8" rx="4"/>
      <rect x="160" y="206" width="44" height="8" rx="4"/>
      <rect x="160" y="236" width="30" height="8" rx="4"/>
      <rect x="160" y="266" width="48" height="8" rx="4"/>
      <rect x="160" y="296" width="36" height="8" rx="4"/>
    </g>
    <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
      <line x1="154" y1="181" x2="202" y2="179"/>
      <line x1="154" y1="241" x2="196" y2="239"/>
      <line x1="154" y1="301" x2="204" y2="299"/>
    </g>
  </g>

  <!-- Book being scanned (back cover with barcode) -->
  <g transform="rotate(9 200 380)">
    <rect x="140" y="300" width="124" height="166" rx="7" fill="#2ba4d8"/>
    <rect x="140" y="300" width="14" height="166" rx="4" fill="#1b7fae"/>
    <rect x="166" y="318" width="80" height="6" rx="3" fill="#fff" opacity=".7"/>
    <rect x="166" y="332" width="58" height="6" rx="3" fill="#fff" opacity=".5"/>
    <rect x="176" y="396" width="72" height="50" rx="4" fill="#fff"/>
    <g fill="#0f172a">
      <rect x="182" y="402" width="2" height="30"/><rect x="186" y="402" width="3" height="30"/><rect x="191" y="402" width="1.5" height="30"/>
      <rect x="195" y="402" width="2.5" height="30"/><rect x="200" y="402" width="1.5" height="30"/><rect x="203" y="402" width="3" height="30"/>
      <rect x="208" y="402" width="1.5" height="30"/><rect x="212" y="402" width="2" height="30"/><rect x="216" y="402" width="3" height="30"/>
      <rect x="221" y="402" width="1.5" height="30"/><rect x="225" y="402" width="2.5" height="30"/><rect x="230" y="402" width="1.5" height="30"/>
      <rect x="234" y="402" width="3" height="30"/><rect x="239" y="402" width="2" height="30"/>
    </g>
    <text x="212" y="442" font-size="7" fill="#0f172a" text-anchor="middle">9 789045 110264</text>
  </g>

  <!-- Stack of books, bottom right -->
  <rect x="334" y="424" width="188" height="28" rx="5" fill="#1f4e9c"/>
  <rect x="344" y="398" width="168" height="28" rx="5" fill="#f5b942"/>
  <rect x="338" y="372" width="176" height="28" rx="5" fill="#f26b6b"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="370" y1="438" x2="470" y2="438"/>
    <line x1="380" y1="412" x2="450" y2="412"/>
    <line x1="374" y1="386" x2="466" y2="386"/>
  </g>

  <!-- Phone -->
  <rect x="308" y="56" width="192" height="336" rx="30" fill="#1e293b"/>
  <rect x="320" y="72" width="168" height="304" rx="20" fill="#fff"/>
  <rect x="380" y="80" width="48" height="6" rx="3" fill="#1e293b"/>

  <!-- Camera view with barcode -->
  <rect x="332" y="98" width="144" height="122" rx="12" fill="#0f172a"/>
  <g fill="#fff">
    <rect x="356" y="136" width="3" height="44"/><rect x="362" y="136" width="5" height="44"/><rect x="370" y="136" width="2" height="44"/>
    <rect x="375" y="136" width="4" height="44"/><rect x="382" y="136" width="2" height="44"/><rect x="387" y="136" width="5" height="44"/>
    <rect x="395" y="136" width="2" height="44"/><rect x="400" y="136" width="3" height="44"/><rect x="406" y="136" width="5" height="44"/>
    <rect x="414" y="136" width="2" height="44"/><rect x="419" y="136" width="4" height="44"/><rect x="426" y="136" width="2" height="44"/>
    <rect x="431" y="136" width="5" height="44"/><rect x="439" y="136" width="3" height="44"/><rect x="445" y="136" width="2" height="44"/>
    <rect x="450" y="136" width="4" height="44"/>
  </g>
  <g stroke="#f5b942" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M344 122v-8a6 6 0 0 1 6-6h8"/><path d="M464 122v-8a6 6 0 0 0-6-6h-8"/>
    <path d="M344 196v8a6 6 0 0 0 6 6h8"/><path d="M464 196v8a6 6 0 0 1-6 6h-8"/>
  </g>
  <rect x="346" y="157" width="116" height="3" rx="1.5" fill="#f5b942" opacity=".9"/>

  <!-- Found book card -->
  <rect x="332" y="232" width="144" height="60" rx="10" fill="#eef4fc"/>
  <rect x="342" y="242" width="30" height="40" rx="4" fill="#2ba4d8"/>
  <rect x="382" y="246" width="70" height="8" rx="4" fill="#14305c"/>
  <rect x="382" y="262" width="52" height="7" rx="3.5" fill="#94a3b8"/>
  <!-- Lenen button -->
  <rect x="332" y="306" width="144" height="40" rx="20" fill="#1f4e9c"/>
  <text x="404" y="331" font-size="16" font-weight="500" fill="#fff" text-anchor="middle">Lenen</text>
</svg>
